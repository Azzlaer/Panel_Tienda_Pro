name: PHP syntax checks
on:
  push:
    branches: [main, "chore/**", "feature/**", "fix/**"]
  pull_request:
permissions:
  contents: read
jobs:
  php-lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
          coverage: none
      - name: Validate PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' -not -path './vendor/*' -print0)

      - name: Installer safety regression checks
        run: php tests/installer_safety.php
      - name: Nexus AdminCP integration checks
        run: php tests/admin_nexus_smoke.php
      - name: Commerce QR and Kiosk smoke checks
        run: php tests/commerce_qr_kiosk_smoke.php
      - name: POS smoke checks
        run: php tests/pos_smoke.php
      - name: Orders PRO smoke checks
        run: php tests/orders_pro_smoke.php
      - name: Enterprise Core smoke checks
        run: php tests/enterprise_core_smoke.php
      - name: hCaptcha auth regression tests
        run: php tests/hcaptcha_auth_test.php
      - name: hCaptcha AdminCP configuration tests
        run: php tests/hcaptcha_admin_settings_test.php
      - name: Security Center regression checks
        run: php tests/security_center_smoke.php
      - name: Integrated modules smoke checks
        run: php tests/integration_suite_smoke.php
      - name: XAMPP CSS asset URL regression
        run: php tests/public_asset_paths_test.php
      - name: Admin catalog sidebar scope regression
        run: php tests/admin_products_nav_collision_test.php
      - name: Content Hub and Page Builder security checks
        run: php tests/content_hub_test.php
      - name: Marketplace Enterprise validation
        run: php tests/marketplace_test.php
      - name: Merchant Center authorization smoke checks
        run: php tests/merchant_center_test.php
      - name: Consolidated v7 integration regression
        run: php tests/integration_pr12_pr14_smoke.php
      - name: Validate Page Builder JavaScript syntax
        run: node --check public/assets/js/content-page-builder.js
      - name: Marketplace JavaScript syntax
        run: node --check public/assets/js/marketplace-enterprise.js

  mariadb-integration:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: commerce_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP for MariaDB integration
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring
          coverage: none
      - name: Transactional POS and Orders integration
        env:
          TEST_DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=commerce_test;charset=utf8mb4
          TEST_DB_USER: root
          TEST_DB_PASS: root
        run: php tests/mariadb_integration.php
      - name: Marketplace Enterprise MariaDB integration
        env:
          TEST_DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=commerce_marketplace_test;charset=utf8mb4
          TEST_DB_USER: root
          TEST_DB_PASS: root
        run: |
          php -r '$pdo=new PDO("mysql:host=127.0.0.1;port=3306;charset=utf8mb4","root","root");$pdo->exec("CREATE DATABASE IF NOT EXISTS commerce_marketplace_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci");'
          php tests/marketplace_mariadb.php
      - name: Merchant Center MariaDB authorization
        env:
          TEST_DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=commerce_merchant_test;charset=utf8mb4
          TEST_DB_USER: root
          TEST_DB_PASS: root
        run: |
          php -r '$pdo=new PDO("mysql:host=127.0.0.1;port=3306;charset=utf8mb4","root","root");$pdo->exec("CREATE DATABASE IF NOT EXISTS commerce_merchant_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci");'
          php tests/merchant_center_mariadb.php
